<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>독서기록</title>
<meta name="theme-color" content="#0d0c0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="독서기록">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Fraunces:opsz,wght@9..144,500;700;800&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Nanum+Pen+Script&display=swap">
<style>
/* 
  지정 디자인 시스템 (IMG_2906 명세):
  - 바깥 배경: #ECE9E3 + 미세 모눈
  - 콘텐츠 시트: #F8F6F1 + 얇은 먹색 테두리 + 회베이지 각진 그림자
  - 먹색: #1E1D24, 포인트 머스터드: #E3A92F, 번트 오렌지: #C85A32, 올리브: #556B2F
  - 폰트: Fraunces (영문 타이틀/큰숫자), 고운바탕 Bold (한글 제목/책등), 고운돋움 (본문), DM Mono (작은 영문 라벨), 나눔펜 (파란 잉크색 #1B4B8A)
*/
:root {
  --bg-color: #ECE9E3;
  --grid-line: rgba(30, 29, 36, 0.045);
  --sheet: #F8F6F1;
  --surface: #FFFFFF;
  --surface-2: #F0EDE6;
  --fg: #1E1D24;
  --ink: #1E1D24;
  --muted: #6E6A64;
  --line: #E2DDD5;
  --accent: #E3A92F;
  --accent-ink: #1E1D24;
  --burnt-orange: #C85A32;
  --olive: #556B2F;
  --blue-ink: #1B4B8A;
  --shadow-hard: #DCD6CB;
  --case: #23211F;
  --plank: #EBE5DB;
  --plank-shade: #C5BBA9;
  --font-title: 'Fraunces', serif;
  --font-hangul: 'Gowun Batang', serif;
  --font-body: 'Gowun Dodum', sans-serif;
  --font-label: 'DM Mono', monospace;
  --font-hand: 'Nanum Pen Script', cursive;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg-color: #151419;
    --grid-line: rgba(255, 255, 255, 0.035);
    --sheet: #201E26;
    --surface: #27242F;
    --surface-2: #302C3A;
    --fg: #F3EFE9;
    --ink: #F3EFE9;
    --muted: #A8A29A;
    --line: #3D3948;
    --accent: #E3A92F;
    --accent-ink: #1E1D24;
    --burnt-orange: #E06D44;
    --olive: #8FA374;
    --blue-ink: #5B92E5;
    --shadow-hard: #0D0C10;
    --case: #17161A;
    --plank: #332F3D;
    --plank-shade: #201D27;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg-color: #151419;
  --grid-line: rgba(255, 255, 255, 0.035);
  --sheet: #201E26;
  --surface: #27242F;
  --surface-2: #302C3A;
  --fg: #F3EFE9;
  --ink: #F3EFE9;
  --muted: #A8A29A;
  --line: #3D3948;
  --accent: #E3A92F;
  --accent-ink: #1E1D24;
  --burnt-orange: #E06D44;
  --olive: #8FA374;
  --blue-ink: #5B92E5;
  --shadow-hard: #0D0C10;
  --case: #17161A;
  --plank: #332F3D;
  --plank-shade: #201D27;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background-color: var(--bg-color);
  background-image: 
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 20px 20px;
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  padding-block: calc(14px + env(safe-area-inset-top, 0px)) 24px;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  min-height: 100vh;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 밝은 종이색 시트 한 장 (#F8F6F1) + 얇은 먹색 테두리 + 각진 회베이지 그림자 */
.app {
  max-width: 560px;
  margin: 0 auto;
  background: var(--sheet);
  border: 1.5px solid var(--ink);
  border-radius: 16px;
  padding: 20px 18px 110px;
  box-shadow: 6px 6px 0px var(--shadow-hard);
  position: relative;
}

/* 검색 */
.search { display: flex; align-items: center; gap: 10px; background: var(--surface-2); border-radius: 14px; padding: 0 14px; height: 46px; }
.search svg { flex: none; color: var(--muted); }
.search input { flex: 1; min-width: 0; background: none; border: 0; outline: none; height: 100%; }
.search input::placeholder { color: var(--muted); }

/* 연도 */
.yearbar { position: relative; display: flex; align-items: baseline; gap: 10px; margin: 26px 0 16px; width: fit-content; }
.yearbar h1 { font-family: var(--font-title); font-size: 32px; line-height: 1.1; margin: 0; font-weight: 700; color: var(--fg); }
.yearbar .count { font-size: 24px; font-family: var(--font-title); color: var(--burnt-orange); font-weight: 700; }
.yearbar .caret { color: var(--accent); align-self: center; }
.yearbar select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

/* 탭 */
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 14px; margin-bottom: 20px; }
.tabs button { border: 0; background: none; height: 38px; border-radius: 10px; color: var(--muted); font-weight: 500; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }

.notice { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; font-size: 13px; color: var(--muted); }
.notice b { color: var(--fg); font-weight: 700; }

/* 일러스트 스타일 책장 (IMG_2905 스타일) */
.case {
  background: #23211f;
  border: 4px solid #36322d;
  border-radius: 12px;
  padding: 22px 10px 10px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.18);
}
.row .books {
  display: flex;
  align-items: flex-end;
  gap: 3px;
  padding: 0 6px;
  min-height: 52px;
}
.plank {
  height: 12px;
  margin-top: 0;
  background: #ebe5db;
  border-bottom: 3px solid #c5bba9;
  border-radius: 1px;
}

/* 일러스트 책등 공통 */
.spine {
  flex: none;
  position: relative;
  border: 0;
  border-radius: 2px 2px 0 0;
  background-color: var(--c);
  color: #fff;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 16px 2px 18px;
  box-sizing: border-box;
  box-shadow: -1px 0 0 rgba(0,0,0,0.35), 1px 0 0 rgba(255,255,255,0.15);
  transition: transform .15s ease;
  cursor: pointer;
  overflow: hidden;
}
.spine:hover, .spine:focus-visible {
  transform: translateY(-8px);
  z-index: 10;
}

/* 세로 책 제목 타이포그래피 */
.spine .t {
  writing-mode: vertical-rl;
  text-orientation: mixed;
  font-family: var(--font-hangul);
  font-weight: 700;
  letter-spacing: 0.05em;
  line-height: 1.15;
  max-height: 115px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  display: block;
  margin: 0 auto;
  color: #ffffff;
  text-shadow: 0 1px 2px rgba(0,0,0,0.6);
  z-index: 2;
}

/* 패턴 0: 상하단 이중 라인 */
.spine.pat-0::before {
  content: '';
  position: absolute;
  top: 7px; left: 3px; right: 3px;
  height: 4px;
  border-top: 1.5px solid rgba(255,255,255,0.65);
  border-bottom: 1.5px solid rgba(255,255,255,0.65);
}
.spine.pat-0::after {
  content: '';
  position: absolute;
  bottom: 8px; left: 3px; right: 3px;
  height: 4px;
  border-top: 1.5px solid rgba(255,255,255,0.65);
  border-bottom: 1.5px solid rgba(255,255,255,0.65);
}

/* 패턴 1: 상단 사각 라벨 프레임 */
.spine.pat-1::before {
  content: '';
  position: absolute;
  top: 8px; left: 4px; right: 4px; height: 16px;
  border: 1px solid rgba(255,255,255,0.6);
  background: rgba(0,0,0,0.18);
  border-radius: 1px;
}
.spine.pat-1::after {
  content: '';
  position: absolute;
  bottom: 8px; left: 4px; right: 4px; height: 2px;
  background: rgba(255,255,255,0.55);
}

/* 패턴 2: 상하단 다이아몬드 장식 */
.spine.pat-2::before {
  content: '◆';
  position: absolute;
  top: 5px;
  font-size: 7.5px;
  color: rgba(255,255,255,0.75);
}
.spine.pat-2::after {
  content: '◆';
  position: absolute;
  bottom: 6px;
  font-size: 7.5px;
  color: rgba(255,255,255,0.75);
}

/* 패턴 3: 가로 리브 밴드 */
.spine.pat-3::before {
  content: '';
  position: absolute;
  top: 6px; bottom: 8px; left: 2px; right: 2px;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 26px,
    rgba(255,255,255,0.4) 26px,
    rgba(255,255,255,0.4) 28px
  );
  pointer-events: none;
}

/* 패턴 4: 상하단 톤온톤 배색 팁 */
.spine.pat-4::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; height: 6px;
  background: rgba(255,255,255,0.3);
}
.spine.pat-4::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0; height: 6px;
  background: rgba(255,255,255,0.3);
}
/* 달력 표지 밑 별점 뱃지 */
.cell .cell-rating {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
  background: linear-gradient(0deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.55) 75%, transparent 100%);
  color: #ffd233;
  font-size: 8px;
  line-height: 1;
  padding: 8px 2px 3px;
  text-align: center;
  letter-spacing: -0.5px;
  white-space: nowrap;
  overflow: hidden;
  text-shadow: 0 1px 2px rgba(0,0,0,0.9);
}

/* 통계 페이지 */
.stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
.stat-card { background: var(--surface); border-radius: 12px; padding: 14px 16px; border: 1px solid var(--line); }
.stat-card .lbl { font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 500; }
.stat-card .val { font-size: 22px; font-weight: 700; color: var(--fg); font-family: var(--font-display); }
.stat-card .unit { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 2px; }

.stats-sec { background: var(--surface); border-radius: 14px; padding: 18px 16px; margin-bottom: 16px; border: 1px solid var(--line); }
.stats-sec h3 { font-size: 15px; font-weight: 700; margin: 0 0 14px; color: var(--fg); display: flex; justify-content: space-between; align-items: center; }
.stats-sec h3 span { font-size: 12px; color: var(--muted); font-weight: 400; }

/* 월별 바 차트 */
.bar-chart { display: flex; align-items: flex-end; gap: 4px; height: 120px; padding-top: 20px; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; }
.bar-val { font-size: 10px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
.bar-track { width: 100%; max-width: 20px; background: var(--surface-2); border-radius: 4px 4px 1px 1px; display: flex; align-items: flex-end; overflow: hidden; height: 80px; }
.bar-fill { width: 100%; background: var(--line); border-radius: 4px 4px 1px 1px; transition: height .4s ease; }
.bar-fill.highlight { background: var(--accent); }
.bar-lbl { font-size: 10px; color: var(--muted); margin-top: 6px; }

/* 장르 분포 프로그레스 바 */
.genre-list { display: flex; flex-direction: column; gap: 10px; }
.genre-row { display: flex; flex-direction: column; gap: 4px; }
.genre-info { display: flex; justify-content: space-between; font-size: 13px; }
.genre-info b { color: var(--fg); font-weight: 600; }
.genre-info span { color: var(--muted); font-size: 12px; }
.genre-bar-track { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.genre-bar-fill { height: 100%; border-radius: 999px; background: var(--accent); transition: width .4s ease; }

/* 장르 태그 뱃지 */
.tag-genre { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 6px; background: var(--surface-2); color: var(--accent); font-weight: 600; margin-left: 6px; }


/* 서재 통계 (Library Stats) 스타일 */
.lib-stats {
  background: var(--surface);
  border-radius: 18px;
  border: 1px solid var(--line);
  padding: 24px 18px;
  margin-bottom: 24px;
}
.lib-header {
  text-align: center;
  margin-bottom: 22px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.lib-mascot {
  width: 64px;
  height: 52px;
  margin-bottom: 8px;
  color: var(--fg);
}
.lib-title {
  font-family: var(--font-title);
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.01em;
  margin: 0 0 4px;
  color: var(--fg);
}
.lib-sub {
  font-family: var(--font-label);
  font-size: 11px;
  letter-spacing: 0.14em;
  color: var(--muted);
  text-transform: uppercase;
}

/* 4열 요약 그리드 */
.lib-summary {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  background: var(--surface-2);
  border-radius: 12px;
  padding: 12px 6px;
  margin-bottom: 24px;
  border: 1px solid var(--line);
}
.lib-sum-col {
  text-align: center;
  padding: 0 4px;
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 0;
}
.lib-sum-col:last-child { border-right: none; }
.lib-sum-lbl {
  font-family: var(--font-label);
  font-size: 10px;
  color: var(--muted);
  margin-bottom: 4px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.lib-sum-val {
  font-family: var(--font-title);
  font-size: 22px;
  font-weight: 700;
  color: var(--fg);
  line-height: 1.15;
}
.lib-sum-val .star { color: #f59e0b; margin-right: 1px; }
.lib-sum-sub {
  font-size: 9.5px;
  color: var(--muted);
  margin-top: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 2컬럼 레이아웃 (올해의 기록 + 월 결산) */
.lib-split {
  display: grid;
  grid-template-columns: 1fr;
  gap: 22px;
}
@media (min-width: 600px) {
  .lib-split { grid-template-columns: 1.1fr 0.9fr; gap: 20px; }
}

/* 도트 매트릭스 그리드 */
.lib-card {
  background: var(--surface-2);
  border-radius: 14px;
  border: 1px solid var(--line);
  padding: 16px;
}
.lib-card-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 14px;
}
.lib-card-tag { font-family: var(--font-label); font-size: 10.5px; color: var(--burnt-orange); letter-spacing: 0.12em; font-weight: 500; text-transform: uppercase; margin-bottom: 2px; }
.lib-card-title { font-size: 17px; font-weight: 700; margin: 0; color: var(--fg); }
.lib-card-yr { font-family: var(--font-title); font-size: 19px; font-weight: 700; color: var(--fg); }
.lib-card-pct { font-family: var(--font-title); font-size: 15px; color: var(--muted); font-weight: 700; margin-left: 8px; }

/* 12열 도트 차트 */
.dot-matrix {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 4px;
  padding: 10px 0;
  background: var(--surface);
  border-radius: 10px;
  border: 1px solid var(--line);
}
.dot-col {
  display: flex;
  flex-direction: column-reverse;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  padding: 4px 1px;
  border-radius: 6px;
  transition: background .15s;
}
.dot-col:hover, .dot-col.selected {
  background: rgba(214, 80, 108, 0.08);
}
.dot-col.selected .dot-lbl {
  color: var(--accent);
  font-weight: 700;
  border-bottom: 2px solid var(--accent);
}
.dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  flex: none;
}
.dot.empty {
  background: rgba(120, 120, 120, 0.18);
}
.dot-lbl {
  font-size: 10px;
  color: var(--muted);
  margin-top: 4px;
  line-height: 1.3;
}
.dot-ft {
  font-size: 11.5px;
  color: var(--olive);
  font-weight: 600;
  margin-top: 10px;
  text-align: left;
}

/* 월 결산 */
.monthly-card {
  padding: 16px;
}
.monthly-guide { font-size: 11px; color: var(--olive); font-weight: 500; margin-bottom: 12px; }
.monthly-top { font-family: var(--font-label); font-size: 10.5px; color: var(--burnt-orange); font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 4px; }
.monthly-head {
  font-family: var(--font-title);
  font-size: 24px;
  font-weight: 700;
  color: var(--fg);
  margin: 0 0 14px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line);
}
.monthly-dl {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 8px 14px;
  font-size: 13px;
  margin: 0;
}
.monthly-dl dt { color: var(--muted); font-weight: 500; }
.monthly-dl dd { margin: 0; color: var(--fg); font-weight: 600; }
.monthly-genres { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }
.genre-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  padding: 2px 7px;
  border-radius: 6px;
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--fg);
  font-weight: 600;
}
.genre-badge .gb-dot { width: 6px; height: 6px; border-radius: 50%; }

/* 읽는 중 (Reading In-Progress) 카드 */
.reading-section { margin-top: 22px; }
.reading-section h3 { font-size: 15px; font-weight: 700; margin: 0 0 12px; color: var(--fg); display: flex; justify-content: space-between; align-items: center; }
.reading-list { display: flex; flex-direction: column; gap: 10px; }
.reading-card {
  display: flex;
  gap: 12px;
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 14px;
  cursor: pointer;
}
.reading-thumb { width: 40px; height: 58px; border-radius: 4px; overflow: hidden; background: var(--c); flex: none; }
.reading-thumb img { width: 100%; height: 100%; object-fit: cover; }
.reading-info { flex: 1; min-width: 0; }
.reading-title { font-weight: 700; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 2px; }
.reading-author { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.reading-prog-track { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.reading-prog-bar { height: 100%; background: var(--accent); border-radius: 999px; transition: width .3s ease; }
.reading-pages { font-size: 11px; color: var(--muted); margin-top: 4px; }

/* 상태 선택 버튼 (완독 vs 읽는 중) */
.status-toggle {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  background: var(--surface-2);
  padding: 4px;

<script>

      ['달러구트 꿈 백화점', 300, 'https://search1.kakaocdn.net/thumb/R120x174.q85/?fname=http%3A%2F%2Ft1.daumcdn.net%2Flbook%2Fimage%2F5418128', '소설', 'finished', 300],
      ['여행의 이유', 200, 'https://search1.kakaocdn.net/thumb/R120x174.q85/?fname=http%3A%2F%2Ft1.daumcdn.net%2Flbook%2Fimage%2F5004128', '시/에세이', 'finished', 200],

    ];

      '<button class="iconbtn" data-nav="-1" aria-label="이전 달"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></button>' +
      '<button class="iconbtn" data-nav="1" aria-label="다음 달"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button></div></div>';
    h += '<div class="cal">' + ['일', '월', '화', '수', '목', '금', '토'].map(function (d) { return '<div class="dow">' + d + '</div>'; }).join('');
    for (var i = 0; i < first; i++) h += '<div class="cell empty"></div>';
    var cnt = 0;
    for (var d = 1; d <= days; d++) {
      var key = ymd(y, m, d), list = map[key] || [], cls = 'cell' + (key === TODAY ? ' today' : '') + (list.length ? ' has' : '');
      if (list.length) {
        cnt += list.length;
        var b = list[0], cv = okCover(b.cover);
        var starBadge = (b.rating > 0) ? '<span class="cell-rating">' + '★'.repeat(b.rating) + '</span>' : '';
        h += '<button class="' + cls + '" data-day="' + key + '" aria-label="' + m + '월 ' + d + '일, ' + esc(b.title) + (list.length > 1 ? ' 외 ' + (list.length - 1) + '권' : '') + '"><span class="d">' + d + '</span>' +
          (cv ? '<img src="' + cv + '" alt="">' : '<div class="tile" style="--c:' + okColor(b.color) + '">' + esc(b.title) + '</div>') +
          starBadge +
          (list.length > 1 ? '<span class="more">+' + (list.length - 1) + '</span>' : '') + '</button>';
      } else {
        h += '<div class="' + cls + '"><span class="d">' + d + '</span></div>';
      }
    }
    h += '</div><p class="monthsum">' + (cnt ? m + '월에 <b>' + cnt + '권</b> 읽었어요.' : m + '월에 읽은 책이 없어요.') + '</p>';
    $('#view').innerHTML = h;
  }

  /* ---------- 렌더: 목록 (완독 / 읽는 중 필터) ---------- */
  function renderList(list) {
    var all = source().filter(matches);
    var finishedList = all.filter(function (b) { return (b.status || 'finished') === 'finished'; });
    var readingList = all.filter(function (b) { return b.status === 'reading'; });

    var curFilter = state.listFilter || 'finished';
    var filtered = list;
    if (curFilter === 'finished') filtered = finishedList;
    else if (curFilter === 'reading') filtered = readingList;
    else filtered = all;

    var filterHtml = '<div class="list-filter">' +
      '<button type="button" class="btn-lf' + (curFilter === 'finished' ? ' on' : '') + '" data-filter="finished">완독 (' + finishedList.length + ')</button>' +
      '<button type="button" class="btn-lf' + (curFilter === 'reading' ? ' on' : '') + '" data-filter="reading">읽는 중 (' + readingList.length + ')</button>' +
      '<button type="button" class="btn-lf' + (curFilter === 'all' ? ' on' : '') + '" data-filter="all">전체 (' + all.length + ')</button>' +
    '</div>';

    if (!filtered.length) {
      var msg = curFilter === 'reading' ? '현재 읽고 있는 책이 없어요.<br><span style="font-size:12px;color:var(--muted)">하단의 [+ 책 추가]에서 \'읽는 중\'을 선택해 등록해 보세요.</span>' : (curFilter === 'finished' ? '완독한 책이 없어요.' : '등록된 책이 없어요.');
      $('#view').innerHTML = filterHtml + '<div class="empty-state">' + msg + '</div>';
      return;
    }

    var itemsHtml = '<div class="list">' + filtered.slice().reverse().map(function (b) {
      var cv = okCover(b.cover);
      var isR = (b.status === 'reading');
      var curP = b.readPages || 0;
      var totP = b.pages || 0;
      var pct = totP > 0 ? Math.min(100, Math.round((curP / totP) * 100)) : 0;
      var stTag = isR ? '<span class="tag-reading">📖 ' + curP + '/' + totP + '쪽 (' + pct + '%)</span>' : '';
      var finishBtn = isR ? '<button type="button" class="btn-quick-finish" data-finish-id="' + esc(b.id) + '">완독</button>' : '';

      return '<div class="item" data-id="' + esc(b.id) + '" style="cursor:pointer;">' +
        '<span class="thumb" style="--c:' + okColor(b.color) + '">' + (cv ? '<img src="' + cv + '" alt="">' : '') + '</span>' +
        '<span class="meta" style="flex:1;min-width:0;">' +
          '<div class="ti">' + esc(b.title) + (b.genre ? '<span class="tag-genre">' + esc(b.genre) + '</span>' : '') + stTag + '</div>' +
          '<div class="sub">' + esc(b.author || '저자 미입력') + ' · ' + (isR ? '읽는 중' : fmtDate(b.date)) + '</div>' +
          (isR && totP > 0 ? '<div class="reading-prog-track" style="margin-top:5px;height:4px;"><div class="reading-prog-bar" style="width:' + pct + '%"></div></div>' : '') +
        '</span>' +
        (isR ? finishBtn : '<span class="stars">' + stars(b.rating) + '</span>') +
      '</div>';
    }).join('') + '</div>';

    $('#view').innerHTML = filterHtml + itemsHtml;
  }


  /* ---------- 렌더: 통계 (Eunju's Library 디자인) ---------- */
  function renderStats(list) {
    var all = source().filter(matches);
    var finishedAll = all.filter(function (b) { return (b.status || 'finished') === 'finished'; });
    var readingAll = all.filter(function (b) { return b.status === 'reading'; });

    var yrFinished = list.filter(function (b) { return (b.status || 'finished') === 'finished'; });
    var ratedBooks = yrFinished.filter(function (b) { return b.rating > 0; });
    var avgRating = ratedBooks.length ? (ratedBooks.reduce(function (s, b) { return s + b.rating; }, 0) / ratedBooks.length).toFixed(2) : '-';

    // 최고점 책
    var highest = null;
    ratedBooks.forEach(function (b) {
      if (!highest || b.rating > highest.rating) highest = b;
    });

    // 올해 진행률 (%)
    var startOfYear = new Date(state.year, 0, 1);
    var endOfYear = new Date(state.year, 11, 31);
    var isThisYear = (state.year === now.getFullYear());
    var dayOfYear = isThisYear ? Math.floor((now - startOfYear) / 86400000) : 365;
    var yearPct = isThisYear ? Math.min(100, Math.max(1, Math.round((dayOfYear / 365) * 100))) : 100;

    // 월별 책 목록 (1~12월)
    var mBooks = {};
    for (var m = 1; m <= 12; m++) mBooks[m] = [];
    yrFinished.forEach(function (b) {
      if (b.date) {
        var m = parseInt(b.date.split('-')[1], 10);
        if (m >= 1 && m <= 12) mBooks[m].push(b);
      }
    });

    // 도트 매트릭스 높이 (최대 권수, 기본 10개)
    var maxM = 0;
    for (var m = 1; m <= 12; m++) if (mBooks[m].length > maxM) maxM = mBooks[m].length;
    var dotRows = Math.max(10, maxM);

    var selM = state.selectedMonth || (now.getMonth() + 1);
    var selBooks = mBooks[selM] || [];
    var selRated = selBooks.filter(function (b) { return b.rating > 0; });
    var selAvg = selRated.length ? (selRated.reduce(function (s, b) { return s + b.rating; }, 0) / selRated.length).toFixed(2) : '-';

    var selHighest = null, selLowest = null;
    selRated.forEach(function (b) {
      if (!selHighest || b.rating > selHighest.rating) selHighest = b;
      if (!selLowest || b.rating < selLowest.rating) selLowest = b;
    });

    // 선택된 달 장르 집계
    var selGMap = {};
    selBooks.forEach(function (b) {
      var g = b.genre || '기타';
      selGMap[g] = (selGMap[g] || 0) + 1;
    });

    var h = '<div class="lib-stats">';

    // 헤더 (북웜 마스코트 + 이름)
    h += '<div class="lib-header">';
    h += MASCOT_SVG;
    h += '<h2 class="lib-title">Eunjoo\'s Library</h2>';
    h += '<div class="lib-sub">BOOKWORM · READING LOG ' + state.year + '</div>';
    h += '</div>';

    // 4열 요약 그리드
    h += '<div class="lib-summary">';
    h += '<div class="lib-sum-col"><div class="lib-sum-lbl">FINISHED 다 읽음</div><div class="lib-sum-val">' + yrFinished.length + '</div></div>';
    h += '<div class="lib-sum-col"><div class="lib-sum-lbl">READING 읽는 중</div><div class="lib-sum-val">' + readingAll.length + '</div></div>';
    h += '<div class="lib-sum-col"><div class="lib-sum-lbl">AVERAGE 평균</div><div class="lib-sum-val"><span class="star">★</span>' + avgRating + '</div><div class="lib-sum-sub">별점 매긴 ' + ratedBooks.length + '권 기준</div></div>';
    h += '<div class="lib-sum-col"><div class="lib-sum-lbl">HIGHEST 최고점</div><div class="lib-sum-val">' + (highest ? '<span class="star">★</span>' + highest.rating : '-') + '</div><div class="lib-sum-sub" title="' + (highest ? esc(highest.title) : '') + '">' + (highest ? esc(highest.title) : '-') + '</div></div>';
    h += '</div>';

    // 2열 분할 레이아웃 (올해의 기록 도트 차트 + 월 결산)
    h += '<div class="lib-split">';

    // 좌측: 올해의 기록 (도트 매트릭스)
    h += '<div class="lib-card">';
    h += '<div class="lib-card-head">';
    h += '<div><div class="lib-card-tag">THE YEAR</div><h3 class="lib-card-title">올해의 기록</h3></div>';
    h += '<div><span class="lib-card-yr">' + state.year + '</span><span class="lib-card-pct">' + yearPct + '%</span></div>';
    h += '</div>';

    h += '<div class="dot-matrix">';
    for (var m = 1; m <= 12; m++) {
      var colBooks = mBooks[m] || [];
      var isSel = (m === selM);
      h += '<div class="dot-col' + (isSel ? ' selected' : '') + '" data-dot-month="' + m + '" title="' + m + '월 ' + colBooks.length + '권">';
      h += '<span class="dot-lbl">' + m + '</span>';
      for (var r = 0; r < dotRows; r++) {
        if (r < colBooks.length) {
          var bk = colBooks[r];
          var gc = GENRE_COLORS[bk.genre] || '#e25b45';
          h += '<span class="dot" style="background:' + gc + '" title="' + esc(bk.title) + ' (' + esc(bk.genre || '소설') + ')"></span>';
        } else {
          h += '<span class="dot empty"></span>';
        }
      }
      h += '</div>';
    }
    h += '</div>';
    h += '<div class="dot-ft">' + yrFinished.length + '권 · 올해 ' + yearPct + '% 지남</div>';
    h += '</div>';

    // 우측: 월 결산
    h += '<div class="lib-card monthly-card">';
    h += '<div class="monthly-guide">점 하나 = 한 권 · 색 = 장르 · 달을 누르면 그 달 결산</div>';
    h += '<div class="monthly-top">MONTHLY · 월 결산</div>';
    h += '<h3 class="monthly-head">' + selM + '월 ' + selBooks.length + '권</h3>';

    h += '<dl class="monthly-dl">';
    h += '<dt>평균</dt><dd>' + (selAvg !== '-' ? '★ ' + selAvg : '-') + '</dd>';
    h += '<dt>최고</dt><dd>' + (selHighest ? esc(selHighest.title) + ' ' + selHighest.rating : '-') + '</dd>';
    h += '<dt>최저</dt><dd>' + (selLowest ? esc(selLowest.title) + ' ' + selLowest.rating : '-') + '</dd>';
    h += '<dt>장르</dt><dd><div class="monthly-genres">';
    var gKeys = Object.keys(selGMap);
    if (!gKeys.length) {
      h += '<span style="color:var(--muted);font-size:12px;">이 달에 완독한 책이 없어요.</span>';
    } else {
      gKeys.forEach(function (gk) {
        var col = GENRE_COLORS[gk] || '#e25b45';
        h += '<span class="genre-badge"><span class="gb-dot" style="background:' + col + '"></span>' + esc(gk) + ' ' + selGMap[gk] + '</span>';
      });
    }
    h += '</div></dd>';
    h += '</dl>';

    h += '</div>'; // end monthly-card
    h += '</div>'; // end lib-split

    // 병렬 독서: 읽는 중인 책 목록 섹션
    if (readingAll.length) {
      h += '<div class="reading-section">';
      h += '<h3>📖 지금 읽고 있는 책 <span>' + readingAll.length + '권</span></h3>';
      h += '<div class="reading-list">';
      readingAll.forEach(function (b) {
        var cv = okCover(b.cover);
        var curP = b.readPages || 0;
        var totP = b.pages || 0;
        var pct = totP > 0 ? Math.min(100, Math.round((curP / totP) * 100)) : 0;
        h += '<div class="reading-card" data-id="' + esc(b.id) + '">';
        h += '<div class="reading-thumb" style="--c:' + okColor(b.color) + '">' + (cv ? '<img src="' + cv + '" alt="">' : '') + '</div>';
        h += '<div class="reading-info">';
        h += '<div class="reading-title">' + esc(b.title) + (b.genre ? '<span class="tag-genre">' + esc(b.genre) + '</span>' : '') + '</div>';
        h += '<div class="reading-author">' + esc(b.author || '저자 미입력') + '</div>';
        h += '<div class="reading-prog-track"><div class="reading-prog-bar" style="width:' + pct + '%"></div></div>';
        h += '<div class="reading-pages">' + (totP > 0 ? curP + ' / ' + totP + '쪽 (' + pct + '%)' : '쪽수 미입력') + '</div>';
        h += '</div>';
        h += '<button type="button" class="btn-quick-finish" data-finish-id="' + esc(b.id) + '">완독</button>';
        h += '</div>';
      });
      h += '</div></div>';
    }

    h += '</div>'; // end lib-stats
    $('#view').innerHTML = h;
  }
  function render() {
    renderHead();
    var list = yearList();
    if (state.tab === 'shelf') renderShelf(list);
    else if (state.tab === 'cal') renderCal();
    else if (state.tab === 'stats') renderStats(list);
    else renderList(list);
  }

  /* ---------- 시트 ---------- */
  var lastFocus = null;
  function openSheet(html) {
    lastFocus = document.activeElement;
    $('#sheet').innerHTML = html;
    $('#overlay').hidden = false;
    var f = $('#sheet').querySelector('input[type="text"], .btn.primary');
    if (f && f.tagName === 'INPUT' && !$('#sheet').querySelector('input[value]:not([value=""])')) f.focus();
  }
  function closeSheet() { $('#overlay').hidden = true; $('#sheet').innerHTML = ''; if (lastFocus && lastFocus.focus) try { lastFocus.focus(); } catch (e) {} }
  var toastTimer;
  function toast(msg) { var t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 2600); }

  function openDetail(id) {
    var b = byId(id); if (!b) return;
    if (b.sample) { toast('예시 책이에요. 첫 책을 추가하면 사라져요.'); return; }
    var cv = okCover(b.cover);
    var isR = (b.status === 'reading');
    var stInfo = isR ? '<dt>상태</dt><dd style="color:var(--accent);font-weight:700;">📖 읽는 중</dd><dt>진행</dt><dd>' + (b.readPages || 0) + ' / ' + (b.pages || 0) + '쪽</dd>' : '<dt>완독일</dt><dd>' + fmtDate(b.date) + '</dd>';
    var finishBtn = isR ? '<button class="btn primary" id="btn-finish" style="background:#4a7c59;">완독하기</button>' : '';

    openSheet('<div class="detail"><div class="bigcover" style="--c:' + okColor(b.color) + '">' + (cv ? '<img src="' + cv + '" alt="">' : '<div class="tile">' + esc(b.title) + '</div>') + '</div><div style="min-width:0"><h2>' + esc(b.title) + '</h2>' +
      '<div style="color:var(--muted)">' + esc(b.author || '저자 미입력') + '</div><dl><dt>장르</dt><dd>' + esc(b.genre || '소설') + '</dd>' + stInfo + (b.pages ? '<dt>쪽수</dt><dd>' + b.pages + '쪽</dd>' : '') + (b.rating ? '<dt>별점</dt><dd class="stars">' + stars(b.rating) + '</dd>' : '') + '</dl></div></div>' +
      '<div class="actions"><button class="btn danger" id="del">삭제</button><button class="btn" id="close">닫기</button>' + finishBtn + '<button class="btn' + (isR ? '' : ' primary') + '" id="edit">수정</button></div>');
    $('#close').onclick = closeSheet;
    $('#edit').onclick = function () { openForm(b); };
    if ($('#btn-finish')) {
      $('#btn-finish').onclick = function () {
        b.status = 'finished';
        b.date = TODAY;
        b.readPages = b.pages || 0;
        openForm(b);
      };
    }
    var armed = false;
    $('#del').onclick = function () {
      if (!armed) { armed = true; this.textContent = '정말 삭제'; return; }
      removeBook(b.id).then(closeSheet);
    };
  }
  function openDay(key) {
    var list = source().filter(matches).filter(function (b) { return b.date === key; });
    if (list.length === 1) { openDetail(list[0].id); return; }
    var p = key.split('-');
    openSheet('<h2>' + (+p[1]) + '월 ' + (+p[2]) + '일에 읽은 책</h2><div class="list">' + list.map(function (b) {
      var cv = okCover(b.cover);
      return '<button class="item" data-id="' + esc(b.id) + '"><span class="thumb" style="--c:' + okColor(b.color) + '">' + (cv ? '<img src="' + cv + '" alt="">' : '') + '</span><span class="meta"><div class="ti">' + esc(b.title) + '</div><div class="sub">' + esc(b.author || '저자 미입력') + '</div></span></button>';
    }).join('') + '</div><div class="actions"><button class="btn primary" id="close">닫기</button></div>');
    $('#close').onclick = closeSheet;
  }

  /* ---------- 폼 ---------- */
  var form = null;
  function openForm(b) {
    var editing = !!b && !b.sample;
    var n = books.length;
    form = {
      id: editing ? b.id : null,
      cover: editing ? okCover(b.cover) : null,
      color: editing ? okColor(b.color) : PALETTE[n % PALETTE.length],
      rating: editing ? (b.rating || 0) : 0,
      coverColor: null
    };
    var v = editing ? b : { title: '', author: '', genre: '소설', status: 'finished', readPages: '', pages: '', date: TODAY };
    if (!v.genre) v.genre = '소설';
    if (!v.status) v.status = 'finished';
    form.status = v.status;
    form.readPages = v.readPages || '';

    var stHtml = '<div class="status-toggle" id="f-st-toggle">' +
      '<button type="button" class="' + (form.status === 'finished' ? 'on' : '') + '" data-st="finished">다 읽음 (완독)</button>' +
      '<button type="button" class="' + (form.status === 'reading' ? 'on' : '') + '" data-st="reading">읽는 중 (병렬 독서)</button>' +
    '</div>';

    openSheet('<h2>' + (editing ? '책 수정' : '책 기록') + '</h2><form id="bf" novalidate>' +
      stHtml +
      '<div class="field"><label for="f-title">제목</label><div class="titlerow"><input id="f-title" type="text" value="' + esc(v.title) + '" autocomplete="off" placeholder="제목을 입력하면 책을 찾아 드려요"><button type="button" class="btn" id="f-find">검색</button></div><div class="err" id="f-err"></div><div class="sug" id="f-sug"></div></div>' +
      '<div class="field"><label for="f-author">저자</label><input id="f-author" type="text" value="' + esc(v.author) + '" autocomplete="off"></div>' +
      '<div class="field"><label for="f-genre">장르 (자동 분류)</label><select id="f-genre" style="width:100%;height:42px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px;color:var(--fg);font-size:14px;">' +
        GENRES.map(function (g) { return '<option value="' + g + '"' + (g === v.genre ? ' selected' : '') + '>' + g + '</option>'; }).join('') +
      '</select></div>' +
      '<div class="two"><div class="field"><label for="f-pages">전체 쪽수</label><input id="f-pages" type="number" inputmode="numeric" min="1" max="3000" value="' + esc(v.pages || '') + '" placeholder="예: 320"></div>' +
      '<div class="field" id="f-rp-box"' + (form.status === 'reading' ? '' : ' style="display:none"') + '><label for="f-readpages">읽은 쪽수</label><input id="f-readpages" type="number" inputmode="numeric" min="0" max="3000" value="' + esc(v.readPages || '') + '" placeholder="예: 120"></div>' +
      '<div class="field" id="f-date-box"><label for="f-date">' + (form.status === 'reading' ? '시작일' : '완독일') + '</label><input id="f-date" type="date" value="' + esc(v.date) + '"></div></div>' +
      '<div class="field" id="f-star-box"' + (form.status === 'reading' ? ' style="display:none"' : '') + '><span class="lab">별점</span><div class="starpick" id="f-stars"></div></div>' +
      '<div class="field"><span class="lab">표지 사진</span><div class="coverrow"><div class="coverprev" id="f-prev"></div><div><input id="f-cover" type="file" accept="image/*" style="display:none"><button type="button" class="btn sm" id="f-pick">사진 고르기</button> <button type="button" class="btn sm" id="f-clear">지우기</button></div></div></div>' +
      '<div class="field"><span class="lab">책등 색</span><div class="swatches" id="f-sw"></div></div>' +
      '<div class="actions"><button type="button" class="btn" id="f-cancel">취소</button><button type="submit" class="btn primary" id="f-save">' + (editing ? '저장' : (form.status === 'reading' ? '읽는 중으로 저장' : '책장에 꽂기')) + '</button></div></form>');
    paintForm();
    $('#f-st-toggle').onclick = function (e) {
      var btn = e.target.closest('button'); if (!btn) return;
      form.status = btn.dataset.st;
      document.querySelectorAll('#f-st-toggle button').forEach(function (b) { b.classList.toggle('on', b.dataset.st === form.status); });
      var isR = form.status === 'reading';
      if ($('#f-rp-box')) $('#f-rp-box').style.display = isR ? '' : 'none';
      if ($('#f-date-box label')) $('#f-date-box label').textContent = isR ? '시작일' : '완독일';
      if ($('#f-star-box')) $('#f-star-box').style.display = isR ? 'none' : '';
      if ($('#f-save')) {
        $('#f-save').textContent = editing ? '저장' : (isR ? '읽는 중으로 저장' : '책장에 꽂기');
      }
    };
    $('#f-cancel').onclick = closeSheet;
    $('#f-pick').onclick = function () { $('#f-cover').click(); };
    $('#f-clear').onclick = function () { form.cover = null; form.coverColor = null; paintForm(); };
    $('#f-cover').onchange = function (e) { var f = e.target.files && e.target.files[0]; if (f) readCover(f); };
    $('#f-stars').onclick = function (e) { var s = e.target.closest('button'); if (!s) return; var v = +s.dataset.v; form.rating = form.rating === v ? 0 : v; paintForm(); };
    $('#f-sw').onclick = function (e) { var s = e.target.closest('button'); if (!s) return; form.color = s.dataset.c; paintForm(); };
    $('#bf').onsubmit = function (e) { e.preventDefault(); submitForm(); };
    setupSearch();
  }
  var searchSeq = 0, sTimer;
  function getJSON(url) {
    return fetch(url).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) { var e = new Error(j.error || 'request failed'); e.code = j.code || String(r.status); throw e; }
        return j;
      });
    });
  }
  var KAKAO_KEY = '9a7e8b069a132a06e9360b1474538d43';

  function searchBooks(q) {
    var url = 'https://dapi.kakao.com/v3/search/book?' + new URLSearchParams({
      query: q, target: 'title', size: '8', sort: 'accuracy'
    });
    return fetch(url, { headers: { Authorization: 'KakaoAK ' + KAKAO_KEY } })
      .then(function (r) {
        if (!r.ok) {
          return fetch('https://dapi.kakao.com/v3/search/book?' + new URLSearchParams({
            query: q, size: '8', sort: 'accuracy'
          }), { headers: { Authorization: 'KakaoAK ' + KAKAO_KEY } }).then(function (r2) { return r2.json(); });
        }
        return r.json();
      })
      .then(function (data) {
        var docs = data.documents || [];
        return {
          items: docs.map(function (d) {
            var rawIsbn = String(d.isbn || '').split(/\s+/).map(function (s) { return s.replace(/[^0-9Xx]/g, ''); }).filter(Boolean);
            var isbn = rawIsbn.find(function (p) { return p.length === 13; }) || rawIsbn.find(function (p) { return p.length === 10; }) || '';
            var thumb = String(d.thumbnail || '').replace(/^http:\/\//, 'https://');
            var coverHd = '';
            try { var f = new URL(thumb).searchParams.get('fname'); if (f) coverHd = String(f).replace(/^http:\/\//, 'https://'); } catch (e) {}
            return {
              title: String(d.title || '').split(' - ')[0].trim(),
              author: (d.authors || []).slice(0, 3).join(', '),
              publisher: d.publisher || '',
              pubYear: d.datetime ? Number(String(d.datetime).slice(0, 4)) || 0 : 0,
              cover: thumb,
              coverHd: coverHd,
              isbn: isbn
            };
          }).filter(function (x) { return x.title; })
        };
      });
  }

  function fetchPages(isbn) {
    var url = 'https://www.googleapis.com/books/v1/volumes?' + new URLSearchParams({
      q: 'isbn:' + isbn, maxResults: '1', fields: 'items(volumeInfo/pageCount)'
    });
    return fetch(url).then(function (r) { return r.json(); }).then(function (j) {
      var n = j.items && j.items[0] && j.items[0].volumeInfo && Number(j.items[0].volumeInfo.pageCount);
      return { pages: n > 0 ? n : 0 };
    }).catch(function () { return { pages: 0 }; });
  }

  function fetchCoverBlob(u) {
    var proxyUrl = 'https://wsrv.nl/?url=' + encodeURIComponent(u);
    return fetch(proxyUrl).then(function (r) {
      if (!r.ok) throw new Error('cover failed');
      return r.blob();
    });
  }

  function setupSearch() {
    var inp = $('#f-title'), box = $('#f-sug'), cur = [];
    function msg(t) { box.innerHTML = '<div class="sugmsg">' + t + '</div>'; }
    function run() {
      var q = inp.value.trim();
      if (q.length < 2) { box.innerHTML = ''; return; }
      var my = ++searchSeq;
      msg('찾는 중…');
      searchBooks(q).then(function (j) {
        if (my !== searchSeq) return;
        cur = j.items || [];
        if (!cur.length) { msg('검색 결과가 없어요. 제목을 직접 입력해도 돼요.'); return; }
        box.innerHTML = cur.map(function (x, i) {
          return '<button type="button" class="sugitem" data-i="' + i + '"><span class="sthumb">' + (x.cover ? '<img src="' + esc(x.cover) + '" alt="" loading="lazy">' : '') + '</span>' +
            '<span class="stext"><b>' + esc(x.title) + '</b><span>' + esc(x.author || '저자 미상') + (x.publisher ? ' · ' + esc(x.publisher) : '') + (x.pubYear ? ' · ' + x.pubYear : '') + '</span></span></button>';
        }).join('');
      }).catch(function (e) {
        if (my !== searchSeq) return;
        msg(e.code === 'no_key' || e.code === 'bad_key' ? '서버의 책 검색 API 키 설정을 확인해 주세요. 제목은 직접 입력해도 돼요.' : '검색하지 못했어요. 잠시 후 다시 눌러 주세요.');
      });
    }
    $('#f-find').onclick = function () { clearTimeout(sTimer); run(); };
    inp.addEventListener('input', function () {
      $('#f-err').textContent = '';
      clearTimeout(sTimer); sTimer = setTimeout(run, 450);
    });
    box.onclick = function (e) {
      var b = e.target.closest('.sugitem'); if (!b) return;
      var x = cur[+b.dataset.i]; if (!x) return;
      searchSeq++; clearTimeout(sTimer);
      inp.value = x.title; $('#f-author').value = x.author;
      var autoG = guessGenre(x.title, x.author, x.publisher);
      if ($('#f-genre')) $('#f-genre').value = autoG;
      msg('표지와 쪽수를 가져오는 중…');
      var jobs = [];
      var covers = [x.coverHd, x.cover].filter(Boolean);
      if (covers.length) jobs.push(covers.reduce(function (p, u) {
        return p.catch(function () {
          return fetchCoverBlob(u).then(function (blob) { if (blob.size < 500) throw 0; return readCover(blob); });
        });
      }, Promise.reject()).catch(function () {}));
      if (x.isbn) jobs.push(fetchPages(x.isbn).then(function (j) { if (j.pages && $('#f-pages')) $('#f-pages').value = j.pages; }).catch(function () {}));
      Promise.all(jobs).then(function () { if ($('#f-sug')) $('#f-sug').innerHTML = ''; });
    };
  }
  function paintForm() {
    if (!$('#f-sw')) return;
    var h = ''; for (var i = 1; i <= 5; i++) h += '<button type="button" data-v="' + i + '" class="' + (i <= form.rating ? 'on' : '') + '" aria-label="별 ' + i + '개">★</button>';
    $('#f-stars').innerHTML = h;
    var cols = PALETTE.slice(); if (form.coverColor) cols.unshift(form.coverColor);
    if (cols.indexOf(form.color) < 0) cols.unshift(form.color);
    $('#f-sw').innerHTML = cols.map(function (c) { return '<button type="button" class="sw" data-c="' + c + '" style="--c:' + c + '" aria-pressed="' + (c === form.color) + '" aria-label="색 ' + c + '"></button>'; }).join('');
    $('#f-prev').innerHTML = form.cover ? '<img src="' + form.cover + '" alt="">' : '없음';
  }
  function readCover(file) {
    return new Promise(function (resolve) {
      var fr = new FileReader();
      fr.onload = function () {
        var img = new Image();
        img.onload = function () {
          var W = 200, sc = Math.min(1, W / img.width), w = Math.round(img.width * sc), h = Math.round(img.height * sc);
          var c = document.createElement('canvas'); c.width = w; c.height = h;
          var g = c.getContext('2d'); g.drawImage(img, 0, 0, w, h);
          form.cover = c.toDataURL('image/jpeg', 0.8);
          var s = document.createElement('canvas'); s.width = 6; s.height = 6;
          var sg = s.getContext('2d'); sg.drawImage(img, 0, 0, 6, 6);
          var d = sg.getImageData(0, 0, 6, 6).data, r = 0, gg = 0, b = 0, k = d.length / 4;
          for (var i = 0; i < d.length; i += 4) { r += d[i]; gg += d[i + 1]; b += d[i + 2]; }
          var mix = function (v) { return Math.round((v / k) * 0.6 + 255 * 0.4); };
          var hex = function (v) { return ('0' + v.toString(16)).slice(-2); };
          form.coverColor = '#' + hex(mix(r)) + hex(mix(gg)) + hex(mix(b));
          form.color = form.coverColor;
          paintForm(); resolve();
        };
        img.onerror = function () { toast('이 사진은 불러올 수 없어요. 다른 사진을 골라 주세요.'); resolve(); };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }
  function submitForm() {
    var title = $('#f-title').value.trim();
    if (!title) { $('#f-err').textContent = '제목을 입력해 주세요.'; $('#f-title').focus(); return; }
    var date = $('#f-date').value || TODAY;
    var pages = parseInt($('#f-pages').value, 10);
    var rPages = parseInt($('#f-readpages') ? $('#f-readpages').value : 0, 10);
    var book = {
      id: form.id || 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      title: title, author: $('#f-author').value.trim(),
      genre: ($('#f-genre') ? $('#f-genre').value : '소설'),
      status: form.status || 'finished',
      readPages: (form.status === 'reading' && rPages > 0) ? rPages : (pages > 0 ? pages : 0),
      pages: pages > 0 ? Math.min(pages, 3000) : 0,
      date: date, rating: form.status === 'reading' ? 0 : form.rating, color: form.color, cover: form.cover
    };
    $('#f-save').disabled = true;
    saveBook(book).then(function (ok) {
      if (!ok) { $('#f-save').disabled = false; return; }
      state.year = +date.slice(0, 4); state.cal = { y: +date.slice(0, 4), m: +date.slice(5, 7) }; state.q = ''; $('#q').value = '';
      closeSheet();
      var isR = (book.status === 'reading');
      if (isR) {
        state.tab = 'list';
        state.listFilter = 'reading';
        try { localStorage.setItem(LS_TAB, 'list'); } catch (x) {}
        render();
        toast('《' + book.title + '》 읽는 중 목록에 저장했어요.');
      } else {
        render();
        toast('《' + book.title + '》 완독하여 책장에 꽂았어요.');
      }
    });
  }

  /* ---------- 저장 ---------- */
  function saveBook(book) {
    var i = books.findIndex(function (b) { return b.id === book.id; });
    if (i >= 0) books[i] = book; else books.push(book);
    return Promise.resolve(saveLocal());
  }
  function removeBook(id) {
    books = books.filter(function (b) { return b.id !== id; });
    saveLocal(); render();
    return Promise.resolve();
  }

  /* ---------- 이벤트 ---------- */
  $('#q').addEventListener('input', function (e) { state.q = e.target.value; render(); });
  $('#year').addEventListener('change', function (e) { state.year = +e.target.value; state.cal.y = state.year; render(); });
  document.querySelector('.tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    state.tab = b.dataset.tab; try { localStorage.setItem(LS_TAB, state.tab); } catch (x) {} render();
  });
  $('#view').addEventListener('click', function (e) {
    var lfBtn = e.target.closest('[data-filter]');
    if (lfBtn) {
      state.listFilter = lfBtn.dataset.filter;
      render();
      return;
    }
    var finishBtn = e.target.closest('[data-finish-id]');
    if (finishBtn) {
      e.stopPropagation();
      var fid = finishBtn.dataset.finishId;
      var bk = byId(fid);
      if (bk) {
        bk.status = 'finished';
        bk.date = TODAY;
        if (bk.pages) bk.readPages = bk.pages;
        if (!bk.rating) bk.rating = 5;
        saveLocal();
        toast('《' + bk.title + '》 완독 완료! 책장과 달력으로 이동했어요.');
        render();
      }
      return;
    }
    var dotCol = e.target.closest('[data-dot-month]');
    if (dotCol) {
      state.selectedMonth = parseInt(dotCol.dataset.dotMonth, 10);
      renderStats(yearList());
      return;
    }
    var rc = e.target.closest('.reading-card');
    if (rc) { openDetail(rc.dataset.id); return; }
    var n = e.target.closest('[data-nav]');
    if (n) { var m = state.cal.m + (+n.dataset.nav), y = state.cal.y; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } state.cal = { y: y, m: m }; renderCal(); return; }
    var d = e.target.closest('[data-day]'); if (d) { openDay(d.dataset.day); return; }
    var i = e.target.closest('[data-id]'); if (i) openDetail(i.dataset.id);
  });
  $('#sheet').addEventListener('click', function (e) { var i = e.target.closest('.item[data-id]'); if (i) openDetail(i.dataset.id); });
  $('#add').addEventListener('click', function () { openForm(null); });
  $('#overlay').addEventListener('click', function (e) { if (e.target === this) closeSheet(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('#overlay').hidden) closeSheet(); });
  var lastW = 0, rt;
  new ResizeObserver(function () {
    var w = $('#view').clientWidth;
    if (w === lastW) return; lastW = w;
    clearTimeout(rt); rt = setTimeout(function () { if (state.tab === 'shelf') renderShelf(yearList()); }, 80);
  }).observe($('#view'));

  render();

  /* ---------- 백업 ---------- */
  function normalize(b) {
    var r = parseInt(b.rating, 10) || 0, p = parseInt(b.pages, 10) || 0;
    return {
      id: typeof b.id === 'string' && b.id ? b.id.slice(0, 40) : 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      title: String(b.title).slice(0, 200), author: String(b.author || '').slice(0, 100),
      pages: Math.max(0, Math.min(3000, p)), date: b.date, rating: Math.max(0, Math.min(5, r)),
      color: okColor(b.color), cover: okCover(b.cover)
    };
  }
  $('#export').addEventListener('click', function () {
    if (!books.length) { toast('내려받을 책이 아직 없어요.'); return; }
    var blob = new Blob([JSON.stringify({ app: 'dokseo', version: 1, books: books })], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'dokseo-backup-' + TODAY + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });
  $('#import').addEventListener('click', function () { $('#importFile').click(); });
  $('#importFile').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0]; if (!f) return;
    var fr = new FileReader();
    fr.onload = function () {
      try {
        var j = JSON.parse(fr.result), arr = Array.isArray(j) ? j : j.books;
        var ok = (arr || []).filter(function (b) { return b && b.title && /^\d{4}-\d{2}-\d{2}$/.test(b.date || ''); }).map(normalize);
        if (!ok.length) throw new Error('empty');
        var map = {}; books.forEach(function (b) { map[b.id] = b; }); ok.forEach(function (b) { map[b.id] = b; });
        books = Object.keys(map).map(function (k) { return map[k]; });
        saveLocal(); render(); toast(ok.length + '권을 불러왔어요.');
      } catch (x) { toast('백업 파일을 읽을 수 없어요.'); }
    };
    fr.readAsText(f); e.target.value = '';
  });
})();
</script>
</body>
