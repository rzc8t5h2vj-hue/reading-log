<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>390px preview</title>
<style>
  html, body { margin: 0; padding: 0; background: #d9d9d9; font-family: -apple-system, sans-serif; }
  .wrap { display: flex; justify-content: center; padding: 8px 0; }
  #host { width: 390px; }
  iframe { width: 390px; height: 884px; border: 0; background: #fff; box-shadow: 0 6px 24px rgba(0,0,0,.25); display: block; }
  #report { max-width: 390px; margin: 8px auto 24px; background: #fff; padding: 8px 10px; font-size: 12px; white-space: pre-wrap; line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap"><div id="host"></div></div>
<div id="report">report</div>
<script>
(function () {
  var qs = new URLSearchParams(location.search);
  var seed = qs.get('seed') || '18';
  var tab = qs.get('tab') || 'shelf';
  var LS_BOOKS = 'dokseo.books.v1';
  var host = document.getElementById('host');
  var out = document.getElementById('report');

  function log(s) { out.textContent += '\n' + s; }

  function show() {
    var f = document.createElement('iframe');
    f.title = 'reading log 390px';
    f.src = './index.html?v=' + Date.now();
    f.onload = function () {
      setTimeout(function () {
        var after = [];
        try { after = JSON.parse(localStorage.getItem(LS_BOOKS) || '[]'); } catch (e) {}
        log('AFTERSTORAGE=' + after.length);
        log('AFTERIDS=' + after.map(function (b) { return b.id + ':' + b.title; }).join(' | '));
        var doc = f.contentDocument;
        var spines = doc ? doc.querySelectorAll('.spine') : [];
        var shelfBooks = [];
        for (var i = 0; i < spines.length; i++) {
          var sb = spines[i];
          shelfBooks.push(sb.getAttribute('aria-label') + '[' + Math.round(sb.getBoundingClientRect().width) + 'x' + Math.round(sb.getBoundingClientRect().height) + ']');
        }
        log('SHELFSPINES=' + spines.length);
        log('SHELF=' + shelfBooks.join(' | '));
        var note = doc ? doc.querySelector('.shelf-note') : null;
        log('NOTE=' + (note ? note.textContent : '(none)'));
        var nt = doc ? doc.getElementById('notice') : null;
        log('NOTICE=' + (nt ? (nt.hidden ? '(hidden)' : nt.textContent) : '(none)'));
      }, 1800);
    };
    host.appendChild(f);
  }

  try {
    localStorage.removeItem('dokseo_gh_token');
    localStorage.removeItem('dokseo_last_sync');
    localStorage.setItem('dokseo.tab', tab);
  } catch (e) {}

  if (seed === 'none') {
    try { localStorage.removeItem(LS_BOOKS); } catch (e) {}
    log('SEED=none');
    show();
  } else if (seed === '18') {
    fetch('./fixture18.json?v=' + Date.now()).then(function (r) { return r.json(); }).then(function (j) {
      var books = Array.isArray(j) ? j : (j.books || []);
      try { localStorage.setItem(LS_BOOKS, JSON.stringify(books)); } catch (e) {}
      log('SEED=' + books.length + ' (' + books.filter(function (b) { return b.sample; }).length + ' sample)');
      show();
    }).catch(function (e) { log('SEEDFAIL=' + e); show(); });
  } else {
    fetch('./dokseo-data.json?v=' + Date.now()).then(function (r) { return r.json(); }).then(function (j) {
      var books = Array.isArray(j) ? j : (j.books || []);
      try { localStorage.setItem(LS_BOOKS, JSON.stringify(books)); } catch (e) {}
      log('SEED=remote ' + books.length);
      show();
    }).catch(function (e) { log('SEEDFAIL=' + e); show(); });
  }
})();
</script>
</body>
</html>
