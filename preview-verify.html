<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>390px verify</title>
<style>
  html, body { margin: 0; padding: 0; background: #d9d9d9; font-family: -apple-system, sans-serif; }
  .wrap { display: flex; justify-content: center; padding: 8px 0; }
  iframe { width: 390px; height: 900px; border: 0; background: #fff; box-shadow: 0 6px 24px rgba(0,0,0,.25); display: block; }
  #report { max-width: 390px; margin: 8px auto 24px; background: #fff; padding: 8px 10px; font-size: 12px; white-space: pre-wrap; line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap"><div id="host"></div></div>
<div id="report">report</div>
<script>
(function () {
  var LS_BOOKS = 'dokseo.books.v1';
  var out = document.getElementById('report');
  function log(s) { out.textContent += '\n' + s; }
  try {
    localStorage.removeItem('dokseo_gh_token');
    localStorage.removeItem('dokseo_last_sync');
    localStorage.setItem('dokseo.tab', 'shelf');
  } catch (e) {}

  fetch('./dokseo-data.json?v=' + Date.now()).then(function (r) { return r.json(); }).then(function (j) {
    var books = Array.isArray(j) ? j : (j.books || []);
    try { localStorage.setItem(LS_BOOKS, JSON.stringify(books)); } catch (e) {}
    log('SEED=' + books.length);
    var f = document.createElement('iframe');
    f.title = 'reading log 390px';
    f.src = './index.html?v=' + Date.now();
    f.onload = function () {
      setTimeout(function () {
        var d = f.contentDocument, w = f.contentWindow;
        if (!d) { log('NODOC'); return; }
        function ff(sel) {
          var el = d.querySelector(sel);
          return el ? w.getComputedStyle(el).fontFamily : '(none)';
        }
        function fs(sel) {
          var el = d.querySelector(sel);
          return el ? (w.getComputedStyle(el).fontSize + ' / ' + w.getComputedStyle(el).fontWeight + ' / ' + w.getComputedStyle(el).letterSpacing + ' / ' + w.getComputedStyle(el).color) : '(none)';
        }
        log('IFRAME_WIDTH=' + f.getBoundingClientRect().width);
        log('SONGMYUNG_LOADED=' + (d.fonts ? d.fonts.check('28px "Song Myung"') : 'n/a'));
        log('PRETENDARD_LOADED=' + (d.fonts ? d.fonts.check('15px "Pretendard"') : 'n/a'));
        log('TITLE_TEXT=' + (d.querySelector('.ex-title') ? d.querySelector('.ex-title').textContent : '(none)'));
        log('TITLE_FONT=' + ff('.ex-title'));
        log('TITLE_SIZE=' + fs('.ex-title'));
        log('SUB_FONT=' + ff('.ex-title .sub'));
        log('SUB_SIZE=' + fs('.ex-title .sub'));
        log('HEADER_ALIGN=' + (d.querySelector('.exhibition-header') ? w.getComputedStyle(d.querySelector('.exhibition-header')).textAlign + ' / padding ' + w.getComputedStyle(d.querySelector('.exhibition-header')).padding : '(none)'));
        log('BODY_FONT=' + ff('body'));
        log('SHELFNOTE_FONT=' + ff('.shelf-note'));
        log('YEARTITLE_FONT=' + ff('#yearTitle'));
        log('SEARCH_INPUT_FONT=' + ff('.search input'));
        log('TABBAR_FONT=' + ff('.tabbar, .tabbar *'));
        log('SPINE_TITLE_FONT=' + ff('.spine .t'));
        log('SPINE_SAMPLE=' + (d.querySelector('.spine .t') ? d.querySelector('.spine .t').textContent : '(none)'));
        var note = d.querySelector('.shelf-note');
        log('NOTE=' + (note ? note.textContent : '(none)'));
        log('SPINES=' + d.querySelectorAll('.spine').length);
        var r = d.querySelector('.ex-title').getBoundingClientRect();
        log('TITLE_BOX=' + Math.round(r.width) + 'x' + Math.round(r.height) + ' top' + Math.round(r.top));
        w.scrollTo(0, 0);
      }, 2500);
    };
    document.getElementById('host').appendChild(f);
  }).catch(function (e) { log('SEEDFAIL=' + e); });
})();
</script>
</body>
</html>
