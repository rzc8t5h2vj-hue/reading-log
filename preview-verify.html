<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>390px verify</title>
<style>
  html, body { margin: 0; padding: 0; background: #d9d9d9; font-family: -apple-system, sans-serif; }
  .wrap { display: flex; justify-content: center; padding: 8px 0; }
  iframe { width: 390px; height: 844px; border: 0; background: #fff; box-shadow: 0 6px 24px rgba(0,0,0,.25); display: block; }
  #report { max-width: 390px; margin: 8px auto 24px; background: #fff; padding: 10px 12px; font-size: 12px; white-space: pre-wrap; line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap"><div id="host"></div></div>
<div id="report">report</div>
<script>
(function () {
  var P = new URLSearchParams(location.search);
  var TAB = P.get('tab') || 'shelf';
  var FIT = P.get('fit') === '1';
  var CHECK = P.get('check') === '1';
  var LS_BOOKS = 'dokseo.books.v1';
  var out = document.getElementById('report');
  function log(s) { out.textContent += '\n' + s; }
  try { localStorage.removeItem('dokseo_gh_token'); localStorage.removeItem('dokseo_last_sync'); } catch (e) {}

  fetch('./dokseo-data.json?v=' + Date.now()).then(function (r) { return r.json(); }).then(function (j) {
    var books = Array.isArray(j) ? j : (j.books || []);
    try { localStorage.setItem(LS_BOOKS, JSON.stringify(books)); localStorage.setItem('dokseo.tab', TAB); } catch (e) {}
    log('TAB=' + TAB + ' FIT=' + FIT);
    log('SEED=' + books.length);
    var f = document.createElement('iframe');
    f.title = 'reading log 390px';
    f.src = './index.html?v=' + Date.now();
    f.onload = function () {
      setTimeout(function () {
        var d = f.contentDocument, w = f.contentWindow;
        if (!d) { log('NODOC'); return; }
        var app = d.querySelector('.app');
        function rect(el) { if (!el) return null; var r = el.getBoundingClientRect(); return { l: Math.round(r.left), r: Math.round(r.right), t: Math.round(r.top), b: Math.round(r.bottom), w: Math.round(r.width), h: Math.round(r.height) }; }
        function cs(el, p) { return el ? w.getComputedStyle(el)[p] : '(none)'; }
        function J(o) { return JSON.stringify(o); }

        log('APP_TAB=' + (app ? app.getAttribute('data-tab') : '(none)'));
        log('BOOKS=' + d.querySelectorAll('.spine').length + ' spines');
        log('PILL_IN_TOPROW=' + (d.querySelector('.top-row #syncStatusText') ? 'STILL_THERE' : 'REMOVED'));
        log('SYNC_BTN_OLD=' + (d.querySelector('#syncStatusBtn') ? 'STILL_THERE' : 'REMOVED'));
        log('CREDIT=' + (d.querySelector('.credit') ? 'STILL_THERE' : 'REMOVED'));

        // 1) 탭별로 푸터·상단 줄·검색·연도 표시 여부 확인
        function tabState(name) {
          var foot = d.querySelector('.foot'), tr = d.querySelector('.top-row'), se = d.querySelector('.search'), yb = d.querySelector('.yearbar'), cal = d.querySelector('.calhead');
          return name + ': foot=' + cs(foot, 'display') + ' toprow=' + cs(tr, 'display') + ' search=' + cs(se, 'display') + ' yearbar=' + cs(yb, 'display') + ' calhead=' + (cal ? 'yes' : 'no');
        }
        if (CHECK) {
          ['shelf', 'cal', 'list', 'stats'].forEach(function (name) {
            var b = d.querySelector('.tabs button[data-tab="' + name + '"]');
            if (b) b.click();
            log(tabState(name));
          });
          var back = d.querySelector('.tabs button[data-tab="' + TAB + '"]');
          if (back) back.click();
          log('RESTORED_TAB=' + (app ? app.getAttribute('data-tab') : '?'));
        }

        // 2) 하단 줄 상태 텍스트가 한 줄로 유지되는지 (연결된 상태 '동기화됨' 포함)
        var foot = d.querySelector('.foot'), syncBtn = d.querySelector('#syncStatusBtn') || d.querySelector('#syncFooterBtn'), txt = d.querySelector('#syncStatusText');
        if (foot && syncBtn && txt) {
          var before = { h: Math.round(foot.getBoundingClientRect().height), t: txt.textContent };
          txt.textContent = '동기화됨';
          var after = { h: Math.round(foot.getBoundingClientRect().height), wrap: foot.getBoundingClientRect().height > 30 };
          log('FOOT_SYNCED_TEST=before ' + J(before) + ' after ' + J(after));
          txt.textContent = before.t;
        }

        // 3) 달력 헤더 3분할 정렬
        var head = d.querySelector('.calhead');
        if (!head && CHECK) { d.querySelector('.tabs button[data-tab="cal"]').click(); head = d.querySelector('.calhead'); }
        if (head) {
          var cn = rect(head), lb = rect(head.querySelector('[data-nav="-1"]')), h2 = rect(head.querySelector('h2')), rb = rect(head.querySelector('[data-nav="1"]'));
          var centerPage = (cn.l + cn.r) / 2, centerTitle = (h2.l + h2.r) / 2;
          log('CALHEAD=' + J(cn));
          log('CAL_LEFT_GAP=' + (lb.l - cn.l) + ' RIGHT_GAP=' + (cn.r - rb.r) + ' TITLE_CENTER_OFFSET=' + (centerTitle - centerPage).toFixed(1));
          log('CAL_TITLE=' + head.querySelector('h2').textContent);
        }

        // 4) 요청한 탭으로 되돌리고 화면 맞추기
        var finalBtn = d.querySelector('.tabs button[data-tab="' + TAB + '"]');
        if (finalBtn && app.getAttribute('data-tab') !== TAB) finalBtn.click();
        setTimeout(function () {
          if (FIT) {
            var h = Math.max(d.documentElement.scrollHeight, d.body.scrollHeight);
            f.style.height = h + 'px';
            log('FIT_HEIGHT=' + h);
          }
          if (TAB === 'shelf') w.scrollTo(0, FIT ? 0 : 999999);
          setTimeout(function () {
            var fr = rect(d.querySelector('.foot')), nr = rect(d.querySelector('.bottom-nav')), br = rect(d.querySelector('.fab'));
            log('FOOT_BOX=' + J(fr));
            log('NAV_BOX=' + J(nr));
            log('FAB_BOX=' + J(br));
            if (fr && nr) {
              log('OVERLAP_NAV=' + (fr.b > nr.t ? 'OVERLAP' : 'clear ' + (nr.t - fr.b) + 'px'));
              var ovx = !(fr.r < br.l || fr.l > br.r), ovy = !(fr.b < br.t || fr.t > br.b);
              log('OVERLAP_FAB=' + (ovx && ovy ? 'OVERLAP' : 'clear'));
            }
            log('APP_PAD_BOTTOM=' + cs(app, 'paddingBottom'));
            log('DONE');
          }, 500);
        }, 300);
      }, 2000);
    };
    document.getElementById('host').appendChild(f);
  }).catch(function (e) { log('SEEDFAIL=' + e); });
})();
</script>
</body>
</html>
