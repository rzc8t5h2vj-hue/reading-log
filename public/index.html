<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>독서기록</title>
<meta name="theme-color" content="#0d0c0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="독서기록">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 한 칼럼 앱. 상단 검색·연도·탭, 본문은 책장(책등 선반) / 달력(표지) / 목록. 책 추가는 하단 고정 버튼과 바텀시트. */
:root {
  --bg: #faf5f3;
  --surface: #ffffff;
  --surface-2: #f2eae7;
  --fg: #2a2226;
  --muted: #7d7077;
  --line: #e7dcd8;
  --accent: #d6506c;
  --accent-ink: #ffffff;
  --plank: #cdb09d;
  --plank-shade: #ab8d7b;
  --case: #f0e6e1;
  --spine-ink: #2b2230;
  --font-display: 'Gowun Batang', 'Noto Serif KR', serif;
  --font-body: 'Noto Sans KR', system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0c0f;
    --surface: #1a181d;
    --surface-2: #27242c;
    --fg: #f4eef1;
    --muted: #9f96a2;
    --line: #34303a;
    --accent: #ee7f96;
    --accent-ink: #2a0d15;
    --plank: #4d3d37;
    --plank-shade: #2f2521;
    --case: #151317;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0c0f;
  --surface: #1a181d;
  --surface-2: #27242c;
  --fg: #f4eef1;
  --muted: #9f96a2;
  --line: #34303a;
  --accent: #ee7f96;
  --accent-ink: #2a0d15;
  --plank: #4d3d37;
  --plank-shade: #2f2521;
  --case: #151317;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { max-width: 560px; margin: 0 auto; padding-bottom: 110px; }

/* 검색 */
.search { display: flex; align-items: center; gap: 10px; background: var(--surface-2); border-radius: 14px; padding: 0 14px; height: 46px; }
.search svg { flex: none; color: var(--muted); }
.search input { flex: 1; min-width: 0; background: none; border: 0; outline: none; height: 100%; }
.search input::placeholder { color: var(--muted); }

/* 연도 */
.yearbar { position: relative; display: flex; align-items: baseline; gap: 10px; margin: 26px 0 16px; width: fit-content; }
.yearbar h1 { font-family: var(--font-display); font-size: 30px; line-height: 1.1; margin: 0; font-weight: 700; }
.yearbar .count { font-size: 22px; font-family: var(--font-display); color: var(--accent); font-weight: 700; }
.yearbar .caret { color: var(--accent); align-self: center; }
.yearbar select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

/* 탭 */
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 14px; margin-bottom: 20px; }
.tabs button { border: 0; background: none; height: 38px; border-radius: 10px; color: var(--muted); font-weight: 500; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }

.notice { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; font-size: 13px; color: var(--muted); }
.notice b { color: var(--fg); font-weight: 700; }

/* 책장 */
.case { background: var(--case); border-radius: 12px; padding: 20px 8px 10px; display: flex; flex-direction: column; gap: 14px; }
.row .books { display: flex; align-items: flex-end; gap: 4px; padding: 0 10px; min-height: 40px; }
.plank { height: 12px; margin-top: 0; border-radius: 2px; background: linear-gradient(var(--plank), var(--plank-shade)); box-shadow: 0 7px 10px -7px rgba(0,0,0,.55); }
.spine {
  --c: #fdb5cd;
  flex: none; position: relative; border: 0; padding: 18px 0 22px; display: flex; justify-content: center; align-items: flex-start;
  border-radius: 4px 4px 2px 2px; color: var(--spine-ink); overflow: hidden;
  background-color: var(--c);
  box-shadow: -2px 0 5px rgba(0,0,0,.22), 2px 0 4px rgba(0,0,0,.12);
  transition: transform .18s ease, box-shadow .18s ease;
}
.spine:hover, .spine:focus-visible {
  transform: translateY(-8px);
  box-shadow: -3px 4px 12px rgba(0,0,0,.4), 3px 4px 10px rgba(0,0,0,.2);
}

/* 실제 표지가 은은하게 깔리는 배경 레이어 */
.spine-cover {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: center 25%;
  opacity: 0.35;
  filter: saturate(1.1) contrast(1.05);
  pointer-events: none;
}

/* 실제 책등의 둥근 입체감(하이라이트/그림자) 및 미세한 종이 질감 */
.spine-shade {
  position: absolute; inset: 0;
  background:
    linear-gradient(90deg,
      rgba(0,0,0,.38) 0%,
      rgba(0,0,0,.10) 10%,
      rgba(255,255,255,.34) 22%,
      rgba(255,255,255,.06) 48%,
      rgba(0,0,0,.08) 82%,
      rgba(0,0,0,.34) 100%),
    repeating-linear-gradient(0deg, rgba(0,0,0,.03) 0px, rgba(0,0,0,.03) 1px, transparent 1px, transparent 4px);
  pointer-events: none;
}

/* 위아래 금박/홈 파임 양각 효과 */
.spine::before {
  content: ""; position: absolute; left: 0; right: 0; height: 3px; top: 10px; z-index: 3;
  background: rgba(0,0,0,.28);
  box-shadow: 0 1px 1px rgba(255,255,255,.35);
}
.spine::after {
  content: ""; position: absolute; left: 0; right: 0; height: 3px; bottom: 12px; z-index: 3;
  background: rgba(0,0,0,.28);
  box-shadow: 0 1px 1px rgba(255,255,255,.35);
}

.spine .t {
  position: relative; z-index: 2;
  writing-mode: vertical-rl;
  font-family: var(--font-display);
  font-weight: 700;
  letter-spacing: .02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-height: 100%;
  min-height: 0;
  text-shadow: 0 1px 2px rgba(255,255,255,.5), 0 0 1px rgba(255,255,255,.8);
}
.shelf-note { margin: 14px 4px 0; font-size: 13px; color: var(--muted); }

/* 달력 */
.calhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.calhead h2 { font-family: var(--font-display); font-size: 20px; margin: 0; }
.calhead .nav { display: flex; gap: 6px; }
.iconbtn { width: 38px; height: 38px; border-radius: 10px; border: 0; background: var(--surface-2); display: grid; place-items: center; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.dow { text-align: center; font-size: 12px; color: var(--muted); padding: 4px 0; }
.dow:first-child { color: var(--accent); }
.cell { position: relative; aspect-ratio: 2 / 3; border-radius: 8px; background: var(--surface); border: 0; padding: 0; overflow: hidden; text-align: left; min-width: 0; }
.cell.empty { background: transparent; }
.cell .d { position: absolute; top: 4px; left: 5px; font-size: 10px; line-height: 1; color: var(--muted); }
.cell.today { outline: 2px solid var(--accent); outline-offset: -2px; }
.cell.today .d { color: var(--accent); font-weight: 700; }
.cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cell.has .d { background: rgba(0,0,0,.6); color: #fff; padding: 2px 4px; border-radius: 4px; z-index: 1; }
.cell .tile { width: 100%; height: 100%; background: var(--c); color: var(--spine-ink); padding: 20px 4px 4px; font-family: var(--font-display); font-weight: 700; font-size: 10px; line-height: 1.25; word-break: keep-all; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; }
.cell .more { position: absolute; right: 4px; bottom: 4px; background: var(--accent); color: var(--accent-ink); font-size: 10px; font-weight: 700; border-radius: 999px; padding: 1px 6px; }
.monthsum { margin-top: 16px; color: var(--muted); font-size: 14px; }
.monthsum b { color: var(--fg); }

/* 목록 */
.list { display: flex; flex-direction: column; gap: 8px; }
.item { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 0; border-radius: 12px; padding: 10px; text-align: left; width: 100%; }
.thumb { flex: none; width: 44px; height: 64px; border-radius: 4px; overflow: hidden; background: var(--c); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.item .meta { min-width: 0; flex: 1; }
.item .ti { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .sub { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stars { color: var(--accent); letter-spacing: 1px; font-size: 13px; white-space: nowrap; }

.empty-state { text-align: center; padding: 56px 12px; color: var(--muted); }

/* 추가 버튼 */
.fab { position: fixed; z-index: 5; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); height: 52px; padding: 0 22px 0 18px; border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 700; display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 24px -8px rgba(0,0,0,.5); }

/* 시트 */
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 92%; overflow: auto; border-radius: 22px 22px 0 0; padding: 22px max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); }
.sheet h2 { font-family: var(--font-display); font-size: 22px; margin: 0 0 16px; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; min-width: 0; }
.field label, .field .lab { font-size: 13px; color: var(--muted); }
.field input[type="text"], .field input[type="number"], .field input[type="date"] { background: var(--surface-2); border: 2px solid transparent; border-radius: 12px; height: 46px; padding: 0 14px; min-width: 0; width: 100%; }
.field input:focus { outline: none; border-color: var(--accent); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.err { color: var(--accent); font-size: 13px; min-height: 0; }
.titlerow { display: flex; gap: 8px; }
.titlerow input { flex: 1; }
.titlerow .btn { flex: none; height: 46px; padding: 0 14px; font-weight: 700; color: var(--accent); }
.sug { display: flex; flex-direction: column; gap: 4px; }
.sug:empty { display: none; }
.sugitem { display: flex; align-items: center; gap: 12px; background: var(--surface-2); border: 0; border-radius: 12px; padding: 8px 12px; text-align: left; width: 100%; }
.sugitem b { font-weight: 700; }
.sugitem .stext { display: flex; flex-direction: column; min-width: 0; }
.sugitem .stext b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sugitem .stext span { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sthumb { flex: none; width: 36px; height: 52px; border-radius: 3px; background: var(--surface); overflow: hidden; }
.sthumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.foot { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.foot button { background: none; border: 0; padding: 4px 0; color: var(--accent); font-size: 12px; text-decoration: underline; }
.foot .credit { flex-basis: 100%; }
.sugmsg { font-size: 13px; color: var(--muted); padding: 4px 2px; }
.starpick { display: flex; gap: 2px; }
.starpick button { border: 0; background: none; font-size: 28px; line-height: 1; padding: 2px 4px; color: var(--line); }
.starpick button.on { color: var(--accent); }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; background: var(--c); padding: 0; box-shadow: 0 0 0 1px var(--line); }
.sw[aria-pressed="true"] { border-color: var(--fg); }
.coverrow { display: flex; align-items: center; gap: 14px; }
.coverprev { width: 60px; height: 88px; border-radius: 6px; background: var(--surface-2); display: grid; place-items: center; color: var(--muted); font-size: 12px; overflow: hidden; flex: none; }
.coverprev img { width: 100%; height: 100%; object-fit: cover; display: block; }
.btn { height: 46px; border-radius: 12px; border: 0; padding: 0 20px; font-weight: 700; background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--accent); }
.btn.sm { height: 38px; padding: 0 14px; font-weight: 500; font-size: 14px; }
.actions { display: flex; gap: 10px; margin-top: 8px; }
.actions .primary { flex: 1; }

.detail { display: flex; gap: 18px; align-items: flex-start; margin-bottom: 18px; }
.bigcover { flex: none; width: 112px; aspect-ratio: 2 / 3; border-radius: 8px; overflow: hidden; background: var(--c); box-shadow: 0 10px 24px -12px rgba(0,0,0,.6); }
.bigcover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.bigcover .tile { padding: 14px 8px; font-family: var(--font-display); font-weight: 700; color: var(--spine-ink); word-break: keep-all; }
.detail h2 { margin-bottom: 4px; }
.detail dl { margin: 12px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; }
.detail dt { color: var(--muted); }
.detail dd { margin: 0; }

.toast { position: fixed; z-index: 30; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; max-width: calc(100% - 32px); text-align: center; }

@media (prefers-reduced-motion: reduce) { .spine { transition: none; } .spine:hover, .spine:focus-visible { transform: none; } }
</style>
</head>
<body>

<div class="app">
  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="책 검색하기" aria-label="책 검색하기" autocomplete="off">
  </div>

  <div class="yearbar">
    <h1 id="yearTitle"></h1>
    <span class="count" id="yearCount"></span>
    <svg class="caret" id="caret" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 7h18l-9 11z"/></svg>
    <select id="year" aria-label="연도 선택"></select>
  </div>

  <div class="tabs" role="tablist">
    <button role="tab" data-tab="shelf" aria-selected="true">책장</button>
    <button role="tab" data-tab="cal" aria-selected="false">달력</button>
    <button role="tab" data-tab="list" aria-selected="false">목록</button>
  </div>

  <div class="notice" id="notice" hidden><b>예시 책이에요.</b> 첫 책을 추가하면 사라지고 내 책장으로 바뀌어요.</div>
  <main id="view"></main>
  <footer class="foot">
    <button type="button" id="export">백업 내려받기</button>
    <button type="button" id="import">백업 불러오기</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <span class="credit">도서 정보: 카카오(Daum) 책 검색 · Google Books</span>
  </footer>
</div>

<button class="fab" id="add" aria-label="책 추가">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  책 추가
</button>

<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  var PALETTE = ['#f9e6f0', '#d3b9e8', '#bfe2f5', '#fdb5cd', '#f6dbe5', '#c9ecd9', '#fde4b8', '#d9d4f7'];
  var LS_BOOKS = 'dokseo.books.v1', LS_TAB = 'dokseo.tab';
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
  var ymd = function (y, m, d) { return y + '-' + pad(m) + '-' + pad(d); };
  var now = new Date();
  var TODAY = ymd(now.getFullYear(), now.getMonth() + 1, now.getDate());
  var okColor = function (c) { return /^#[0-9a-f]{6}$/i.test(c || '') ? c : PALETTE[0]; };
  var okCover = function (c) { return typeof c === 'string' && c.indexOf('data:image/') === 0 ? c : null; };
  var hash = function (s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; };
  var stars = function (n) { n = n || 0; return n ? '★'.repeat(n) + '☆'.repeat(5 - n) : ''; };
  var fmtDate = function (s) { return s.replace(/-/g, '.'); };

  /* ---------- 상태 ---------- */
  var books = [];
  var state = { tab: 'shelf', year: now.getFullYear(), q: '', cal: { y: now.getFullYear(), m: now.getMonth() + 1 } };

  try { var t = localStorage.getItem(LS_TAB); if (t === 'shelf' || t === 'cal' || t === 'list') state.tab = t; } catch (e) {}
  try { var raw = localStorage.getItem(LS_BOOKS); if (raw) books = JSON.parse(raw) || []; } catch (e) { books = []; }
  var quotaWarned = false;
  function saveLocal() {
    try { localStorage.setItem(LS_BOOKS, JSON.stringify(books)); return true; }
    catch (e) { if (!quotaWarned) { quotaWarned = true; toast('저장 공간이 가득 찼어요. 백업을 내려받고 표지가 큰 책을 정리해 주세요.'); } return false; }
  }

  /* ---------- 예시 책 ---------- */
  function makeSamples() {
    var src = [
      ['채식주의자', 180, 'https://search1.kakaocdn.net/thumb/R120x174.q85/?fname=http%3A%2F%2Ft1.daumcdn.net%2Flbook%2Fimage%2F6042324'],
      ['아몬드', 264, 'https://search1.kakaocdn.net/thumb/R120x174.q85/?fname=http%3A%2F%2Ft1.daumcdn.net%2Flbook%2Fimage%2F1710525'],
      ['불편한 편의점', 268, 'https://search1.kakaocdn.net/thumb/R120x174.q85/?fname=http%3A%2F%2Ft1.daumcdn.net%2Flbook%2Fimage%2F5620921'],
      ['데미안', 240, 'https://search1.kakaocdn.net/thumb/R120x174.q85/?fname=http%3A%2F%2Ft1.daumcdn.net%2Flbook%2Fimage%2F1252874'],
      ['어린 왕자', 120, 'https://search1.kakaocdn.net/thumb/R120x174.q85/?fname=http%3A%2F%2Ft1.daumcdn.net%2Flbook%2Fimage%2F1253086'],
      ['지구 끝의 온실', 360, 'https://search1.kakaocdn.net/thumb/R120x174.q85/?fname=http%3A%2F%2Ft1.daumcdn.net%2Flbook%2Fimage%2F5781329'],
      ['파친코', 520, 'https://search1.kakaocdn.net/thumb/R120x174.q85/?fname=http%3A%2F%2Ft1.daumcdn.net%2Flbook%2Fimage%2F6080518'],

  function submitForm() {
    var title = $('#f-title').value.trim();
    if (!title) { $('#f-err').textContent = '제목을 입력해 주세요.'; $('#f-title').focus(); return; }
    var date = $('#f-date').value || TODAY;
    var pages = parseInt($('#f-pages').value, 10);
    var book = {
      id: form.id || 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      title: title, author: $('#f-author').value.trim(),
      pages: pages > 0 ? Math.min(pages, 3000) : 0,
      date: date, rating: form.rating, color: form.color, cover: form.cover
    };
    $('#f-save').disabled = true;
    saveBook(book).then(function (ok) {
      if (!ok) { $('#f-save').disabled = false; return; }
      state.year = +date.slice(0, 4); state.cal = { y: +date.slice(0, 4), m: +date.slice(5, 7) }; state.q = ''; $('#q').value = '';
      closeSheet(); render(); toast('책장에 꽂았어요.');
    });
  }

  /* ---------- 저장 ---------- */
  function saveBook(book) {
    var i = books.findIndex(function (b) { return b.id === book.id; });
    if (i >= 0) books[i] = book; else books.push(book);
    return Promise.resolve(saveLocal());
  }
  function removeBook(id) {
    books = books.filter(function (b) { return b.id !== id; });
    saveLocal(); render();
    return Promise.resolve();
  }

  /* ---------- 이벤트 ---------- */
  $('#q').addEventListener('input', function (e) { state.q = e.target.value; render(); });
  $('#year').addEventListener('change', function (e) { state.year = +e.target.value; state.cal.y = state.year; render(); });
  document.querySelector('.tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    state.tab = b.dataset.tab; try { localStorage.setItem(LS_TAB, state.tab); } catch (x) {} render();
  });
  $('#view').addEventListener('click', function (e) {
    var n = e.target.closest('[data-nav]');
    if (n) { var m = state.cal.m + (+n.dataset.nav), y = state.cal.y; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } state.cal = { y: y, m: m }; renderCal(); return; }
    var d = e.target.closest('[data-day]'); if (d) { openDay(d.dataset.day); return; }
    var i = e.target.closest('[data-id]'); if (i) openDetail(i.dataset.id);
  });
  $('#sheet').addEventListener('click', function (e) { var i = e.target.closest('.item[data-id]'); if (i) openDetail(i.dataset.id); });
  $('#add').addEventListener('click', function () { openForm(null); });
  $('#overlay').addEventListener('click', function (e) { if (e.target === this) closeSheet(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('#overlay').hidden) closeSheet(); });
  var lastW = 0, rt;
  new ResizeObserver(function () {
    var w = $('#view').clientWidth;
    if (w === lastW) return; lastW = w;
    clearTimeout(rt); rt = setTimeout(function () { if (state.tab === 'shelf') renderShelf(yearList()); }, 80);
  }).observe($('#view'));

  render();

  /* ---------- 백업 ---------- */
  function normalize(b) {
    var r = parseInt(b.rating, 10) || 0, p = parseInt(b.pages, 10) || 0;
    return {
      id: typeof b.id === 'string' && b.id ? b.id.slice(0, 40) : 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      title: String(b.title).slice(0, 200), author: String(b.author || '').slice(0, 100),
      pages: Math.max(0, Math.min(3000, p)), date: b.date, rating: Math.max(0, Math.min(5, r)),
      color: okColor(b.color), cover: okCover(b.cover)
    };
  }
  $('#export').addEventListener('click', function () {
    if (!books.length) { toast('내려받을 책이 아직 없어요.'); return; }
    var blob = new Blob([JSON.stringify({ app: 'dokseo', version: 1, books: books })], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'dokseo-backup-' + TODAY + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });
  $('#import').addEventListener('click', function () { $('#importFile').click(); });
  $('#importFile').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0]; if (!f) return;
    var fr = new FileReader();
    fr.onload = function () {
      try {
        var j = JSON.parse(fr.result), arr = Array.isArray(j) ? j : j.books;
        var ok = (arr || []).filter(function (b) { return b && b.title && /^\d{4}-\d{2}-\d{2}$/.test(b.date || ''); }).map(normalize);
        if (!ok.length) throw new Error('empty');
        var map = {}; books.forEach(function (b) { map[b.id] = b; }); ok.forEach(function (b) { map[b.id] = b; });
        books = Object.keys(map).map(function (k) { return map[k]; });
        saveLocal(); render(); toast(ok.length + '권을 불러왔어요.');
      } catch (x) { toast('백업 파일을 읽을 수 없어요.'); }
    };
    fr.readAsText(f); e.target.value = '';
  });
})();
</script>
</body>
</html>
